name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    # No secrets: OPENAI_API_KEY is unset, so chat uses the demo fallback and
    # the LLM/eval tests use a mocked client. Nothing calls external services.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check backend tests
          ruff format --check backend tests
      - name: Run tests
        run: python -m pytest -q
      - name: Chat tool-selection eval (mock client)
        run: python backend/evals/run_evals.py --mock --fail-under 1.0
      # Plumbing test only: a scripted client, not a measure of model safety.
      - name: Safety/faithfulness eval harness (mock client)
        run: python backend/evals/run_safety_evals.py --mock --fail-under 1.0

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CI: true
